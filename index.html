<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniKit</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
  const EMAIL_CFG = { serviceId:'', templateId:'', publicKey:'' };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3.11.0/dist/email.min.js"></script>
  <style>
    :root {
      --cobalt:#2D5BFF; --cobalt-d:#1A3FCC; --cobalt-l:#5B7CFF; --pink:#FF5FA2; --wood:#FFE3B3;
      --ink:#0E1530; --ink-2:#3D4460; --muted:#5A6482;
      --bg:#FFFFFF; --ice:#EEF2FF; --tint:#F6F8FF; --card:#FFFFFF; --border:#DCE2F4;
      --ok:#1F9D55; --err:#E5484D;
      --r:16px; --r-sm:12px; --r-xs:8px; --r-full:100px;
      --max:1160px; --nav-h:64px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
    h1,h2,h3,h4{font-family:'Bricolage Grotesque',sans-serif;}
    a{text-decoration:none;color:inherit;cursor:pointer;}
    button{font-family:'DM Sans',sans-serif;cursor:pointer;}
    svg{display:block;}
    .container{width:100%;max-width:var(--max);margin:0 auto;padding:0 40px;}
    @media(max-width:640px){.container{padding:0 16px;}}
    #app{padding-top:var(--nav-h);}
    .price{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em;}

    /* LOGO */
    .logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;}
    .logo .mk{width:27px;height:31px;}
    .logo .wm{font-family:'Bricolage Grotesque',sans-serif;font-weight:400;font-size:23px;letter-spacing:-.025em;color:var(--ink);line-height:1;}
    .logo .wm b{font-weight:800;}
    .logo.dark .wm{color:#fff;}

    /* NAVBAR */
    .navbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:500;}
    .navbar .container{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;}
    .nav-links{display:flex;align-items:center;gap:4px;margin-right:auto;margin-left:24px;}
    .nav-link{padding:8px 14px;border-radius:var(--r-full);font-size:14px;font-weight:500;color:var(--ink-2);background:none;border:none;transition:background .14s,color .14s;white-space:nowrap;}
    .nav-link:hover{background:var(--ice);color:var(--ink);}
    .nav-right{display:flex;align-items:center;gap:8px;}
    .cart-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:var(--r-full);background:var(--card);border:1.5px solid var(--border);font-weight:600;font-size:14px;color:var(--ink);transition:border-color .14s;}
    .cart-btn:hover{border-color:var(--cobalt);}
    .cart-count{min-width:20px;height:20px;border-radius:var(--r-full);background:var(--pink);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;}
    .login-btn{height:40px;padding:0 18px;border-radius:var(--r-full);background:var(--ink);color:#fff;border:none;font-weight:600;font-size:14px;transition:opacity .14s;}
    .login-btn:hover{opacity:.85;}
    @media(max-width:700px){.nav-links{display:none;}}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:var(--r-sm);border:none;font-family:'DM Sans',sans-serif;font-weight:700;font-size:15px;transition:all .15s;white-space:nowrap;}
    .btn-primary{background:var(--cobalt);color:#fff;}
    .btn-primary:hover{background:var(--cobalt-d);}
    .btn-sec{background:#fff;color:var(--ink);border:1.5px solid var(--border);}
    .btn-sec:hover{border-color:var(--ink);}
    .btn-quiet{background:var(--ice);color:var(--cobalt);}
    .btn-quiet:hover{background:#E1E7FF;}
    .btn-full{width:100%;}
    .btn-sm{padding:10px 18px;font-size:14px;}
    .ico{width:20px;height:20px;flex-shrink:0;}

    /* HERO */
    .hero{padding:56px 0 64px;}
    .hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;}
    @media(max-width:860px){.hero-grid{grid-template-columns:1fr;gap:36px;}}
    .announce-pill{display:inline-flex;align-items:center;gap:8px;background:var(--ice);border-radius:var(--r-full);padding:7px 14px;font-size:13px;font-weight:600;color:var(--cobalt);margin-bottom:22px;}
    .hero h1{font-size:clamp(40px,5.4vw,64px);font-weight:800;letter-spacing:-.045em;line-height:.98;color:var(--ink);margin-bottom:18px;}
    .hero h1 em{font-style:normal;color:var(--cobalt);}
    .hero-sub{font-size:17px;color:var(--muted);line-height:1.6;margin-bottom:28px;max-width:440px;}
    .hero-filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-width:460px;}
    .sel-wrap{position:relative;}
    .sel-wrap select{width:100%;padding:15px 44px 15px 18px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--tint);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:var(--ink);-webkit-appearance:none;appearance:none;cursor:pointer;outline:none;transition:border-color .14s;}
    .sel-wrap select:focus{border-color:var(--cobalt);}
    .sel-wrap svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none;color:var(--muted);}
    .hero-cta{max-width:460px;margin-bottom:20px;}
    .trust-row{display:flex;gap:18px;flex-wrap:wrap;}
    .trust-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500;}
    .trust-item svg{width:16px;height:16px;color:var(--cobalt);}

    /* HERO VISUAL */
    .hero-visual{background:var(--ice);border-radius:28px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:28px 24px 108px;}
    .hero-visual .kit{width:100%;max-width:440px;}
    @media(max-width:640px){.hero-visual{padding:20px 16px 96px;}.hero-badge{left:16px;right:16px;bottom:28px;}}
    .ticks{position:absolute;left:0;bottom:0;width:100%;height:16px;opacity:.5;}
    .sticker{position:absolute;top:28px;right:28px;width:112px;height:112px;border-radius:50%;background:var(--pink);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);}
    .sticker small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
    .sticker b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1;}
    .hero-badge{position:absolute;bottom:32px;left:28px;background:#fff;border-radius:var(--r-sm);padding:12px 16px;box-shadow:0 8px 24px rgba(14,21,48,.1);display:flex;align-items:center;gap:12px;}
    .hb-ic{width:32px;height:32px;border-radius:8px;background:#E3F5EA;color:var(--ok);display:flex;align-items:center;justify-content:center;}
    .hb-ic svg{width:18px;height:18px;}
    .hb-text{font-size:14px;font-weight:700;color:var(--ink);}
    .hb-sub{font-size:12px;color:var(--muted);}

    /* SECTIONS */
    .section-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cobalt);margin-bottom:8px;}
    .section-title{font-size:clamp(26px,3.5vw,36px);font-weight:800;letter-spacing:-.035em;line-height:1.1;color:var(--ink);}

    /* MAJOR CARDS */
    .majors-section{padding:56px 0 72px;}
    .majors-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px;}
    .majors-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    @media(max-width:760px){.majors-grid{grid-template-columns:1fr 1fr;}}
    @media(max-width:480px){.majors-grid{grid-template-columns:1fr;}}
    .major-card{background:#fff;border-radius:20px;overflow:hidden;border:1.5px solid var(--border);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;}
    .major-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(14,21,48,.08);border-color:#C9D2F0;}
    .major-card-art{height:200px;display:flex;align-items:center;justify-content:center;background:var(--ice);}
    .major-card-art .art{height:82%;}
    .major-card-body{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1.5px solid var(--border);}
    .major-card-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.02em;}
    .major-card-count{font-size:13px;color:var(--muted);margin-top:2px;}
    .arrow-btn{width:38px;height:38px;border-radius:50%;background:var(--ice);display:flex;align-items:center;justify-content:center;color:var(--cobalt);flex-shrink:0;transition:all .14s;}
    .arrow-btn svg{width:18px;height:18px;}
    .major-card:hover .arrow-btn{background:var(--cobalt);color:#fff;}

    /* CATALOG */
    .catalog-page{padding:40px 0 80px;min-height:calc(100vh - var(--nav-h));}
    .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px;}
    .pill{padding:9px 18px;border-radius:var(--r-full);border:1.5px solid var(--border);font-weight:600;font-size:14px;background:#fff;color:var(--ink-2);transition:all .13s;cursor:pointer;white-space:nowrap;}
    .pill:hover{border-color:var(--cobalt);color:var(--cobalt);}
    .pill.active{background:var(--cobalt);color:#fff;border-color:var(--cobalt);}
    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 24px;}
    .fsel{position:relative;min-width:200px;}
    .fsel select{width:100%;height:50px;padding:0 46px 0 18px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;color:var(--ink);-webkit-appearance:none;appearance:none;cursor:pointer;outline:none;transition:border-color .14s,box-shadow .14s;}
    .fsel select:hover{border-color:#B9C4EC;}
    .fsel select:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(45,91,255,.12);}
    .fsel.on select{border-color:var(--cobalt);color:var(--cobalt);font-weight:600;background:var(--tint);}
    .fsel svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none;color:var(--ink-2);}
    .fsel.sort{margin-left:auto;}
    .clear-btn{background:none;border:none;font-size:14px;font-weight:600;color:var(--muted);padding:8px 6px;}
    .clear-btn:hover{color:var(--cobalt);}
    @media(max-width:640px){.filter-bar{gap:8px;}.fsel{min-width:0;flex:1 1 calc(50% - 4px);}.fsel.sort{margin-left:0;flex:1 1 0;order:2;}.clear-btn{order:3;}}
    .product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
    @media(max-width:960px){.product-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:640px){.product-grid{grid-template-columns:repeat(2,1fr);gap:10px;}}
    .pcard{background:#fff;border-radius:var(--r);overflow:hidden;border:1.5px solid var(--border);cursor:pointer;display:flex;flex-direction:column;transition:transform .14s,box-shadow .14s,border-color .14s;}
    .pcard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(14,21,48,.08);border-color:#C9D2F0;}
    .pcard-thumb{aspect-ratio:1/0.9;background:var(--ice);display:flex;align-items:center;justify-content:center;position:relative;}
    .pcard-thumb .art{width:72%;}
    .pcard-major{position:absolute;top:10px;left:10px;background:#fff;border-radius:var(--r-full);padding:4px 10px;font-size:11px;font-weight:700;color:var(--cobalt);}
    .pcard-body{padding:14px 14px 14px;flex:1;display:flex;flex-direction:column;border-top:1.5px solid var(--border);}
    .pcard-cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
    .pcard-name{font-weight:600;font-size:15px;line-height:1.3;flex:1;margin-bottom:12px;}
    .pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .pcard-price{font-size:18px;color:var(--ink);white-space:nowrap;}
    @media(max-width:640px){.pcard-price{font-size:16px;}.add-btn{width:34px;padding:0;}.add-btn .t{display:none;}.pcard-body{padding:12px;}.pcard-name{font-size:14px;}}
    .add-btn{height:34px;padding:0 14px;border-radius:var(--r-full);background:var(--ice);color:var(--cobalt);border:none;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;transition:all .13s;flex-shrink:0;}
    .add-btn:hover{background:var(--cobalt);color:#fff;}
    .add-btn.in-cart{background:var(--cobalt);color:#fff;}
    .add-btn svg{width:14px;height:14px;}

    /* HOW IT WORKS */
    .hiw-section{padding:64px 0 80px;background:var(--tint);border-top:1px solid var(--border);}
    .hiw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px;}
    @media(max-width:700px){.hiw-grid{grid-template-columns:1fr;}}
    .hiw-card{background:#fff;border-radius:20px;padding:26px;border:1.5px solid var(--border);}
    .hiw-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
    .hiw-icon{width:48px;height:48px;border-radius:var(--r-sm);background:var(--ice);color:var(--cobalt);display:flex;align-items:center;justify-content:center;}
    .hiw-icon svg{width:24px;height:24px;}
    .hiw-n{width:28px;height:28px;border-radius:50%;background:var(--cobalt);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
    .hiw-card h3{font-weight:800;font-size:19px;letter-spacing:-.02em;margin-bottom:6px;}
    .hiw-card p{font-size:14px;color:var(--muted);line-height:1.6;}

    /* PRODUCT DETAIL */
    .pd-page{padding:32px 0 80px;}
    .pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;}
    @media(max-width:760px){.pd-grid{grid-template-columns:1fr;gap:28px;}}
    .pd-thumb{aspect-ratio:1;background:var(--ice);border-radius:24px;display:flex;align-items:center;justify-content:center;}
    .pd-thumb .art{width:70%;}
    .pd-tags{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
    .tag{padding:5px 12px;border-radius:var(--r-full);font-size:12px;font-weight:700;}
    .tag-blue{background:var(--ice);color:var(--cobalt);}
    .tag-ink{background:#EDEFF4;color:var(--ink-2);}
    .tag-green{background:#E3F5EA;color:var(--ok);}
    .pd-body h1{font-size:clamp(28px,3.6vw,40px);font-weight:800;letter-spacing:-.035em;margin-bottom:10px;line-height:1.08;}
    .pd-price{font-size:clamp(30px,4vw,42px);color:var(--ink);margin-bottom:18px;}
    .pd-desc{font-size:16px;color:var(--muted);line-height:1.7;margin-bottom:28px;max-width:460px;}
    .pd-actions{display:flex;gap:10px;flex-wrap:wrap;}
    .pd-note{display:flex;align-items:center;gap:10px;margin-top:24px;padding:14px 16px;border-radius:var(--r-sm);background:var(--tint);border:1.5px solid var(--border);font-size:14px;color:var(--ink-2);max-width:460px;}
    .pd-note svg{width:20px;height:20px;color:var(--cobalt);}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:24px;transition:color .13s;}
    .back-link:hover{color:var(--ink);}
    .back-link svg{width:16px;height:16px;}

    /* CART */
    .cart-page{padding:40px 0 80px;}
    .page-title{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.04em;margin-bottom:4px;}
    .page-sub{color:var(--muted);font-size:15px;}
    .cart-grid{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;margin-top:28px;}
    @media(max-width:860px){.cart-grid{grid-template-columns:1fr;}}
    .cart-items{background:#fff;border-radius:var(--r);border:1.5px solid var(--border);overflow:hidden;}
    .cart-item{display:flex;gap:16px;padding:16px 18px;border-bottom:1.5px solid var(--border);align-items:center;}
    .cart-item:last-child{border-bottom:none;}
    .thumb-sm{width:72px;height:72px;border-radius:var(--r-sm);background:var(--ice);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .thumb-sm .art{width:78%;}
    .thumb-xs{width:44px;height:44px;border-radius:var(--r-xs);}
    .ci-info{flex:1;min-width:0;}
    .ci-name{font-weight:600;font-size:15px;margin-bottom:2px;}
    .ci-meta{font-size:13px;color:var(--muted);margin-bottom:10px;}
    .qty-row{display:flex;align-items:center;gap:10px;}
    .qty-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .13s;color:var(--ink);}
    .qty-btn:hover{border-color:var(--cobalt);color:var(--cobalt);}
    .qty-n{font-weight:700;font-size:15px;min-width:20px;text-align:center;}
    .ci-price{font-size:17px;flex-shrink:0;}
    .order-summary{background:#fff;border-radius:var(--r);border:1.5px solid var(--border);padding:22px;position:sticky;top:calc(var(--nav-h) + 16px);}
    .order-summary h3{font-size:18px;font-weight:800;margin-bottom:14px;letter-spacing:-.02em;}
    .sum-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px;gap:12px;}
    .sum-row .lbl{color:var(--muted);}
    .sum-row .val{font-weight:600;white-space:nowrap;}
    .sum-row.total{border-top:1.5px solid var(--border);margin-top:8px;padding-top:14px;}
    .sum-row.total .lbl{font-size:16px;font-weight:700;color:var(--ink);}
    .sum-row.total .val{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;color:var(--ink);}
    .empty{text-align:center;padding:64px 24px;background:var(--tint);border-radius:20px;border:1.5px solid var(--border);margin-top:24px;}
    .empty .ei{width:64px;height:64px;border-radius:18px;background:#fff;color:var(--cobalt);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;border:1.5px solid var(--border);}
    .empty .ei svg{width:28px;height:28px;}
    .empty h3{font-size:20px;font-weight:800;margin-bottom:6px;}
    .empty p{color:var(--muted);font-size:14px;margin-bottom:20px;}

    /* CHECKOUT */
    .checkout-page{padding:32px 0 80px;}
    .checkout-grid{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;margin-top:28px;}
    @media(max-width:860px){.checkout-grid{grid-template-columns:1fr;}}
    .checkout-form-wrap{background:#fff;border-radius:var(--r);border:1.5px solid var(--border);padding:28px;}
    @media(max-width:640px){.checkout-form-wrap{padding:20px;}}
    .checkout-form-wrap h2{font-size:20px;font-weight:800;margin-bottom:20px;letter-spacing:-.02em;}
    .field{margin-bottom:18px;}
    .field label{display:block;margin-bottom:6px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
    .field input,.field select{width:100%;padding:14px 16px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-family:'DM Sans',sans-serif;font-size:15px;color:var(--ink);background:var(--tint);outline:none;transition:border-color .14s;-webkit-appearance:none;appearance:none;}
    .field input:focus,.field select:focus{border-color:var(--cobalt);background:#fff;}
    .pickup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media(max-width:420px){.pickup-grid{grid-template-columns:1fr;}}
    .pickup-card{padding:16px;border-radius:var(--r-sm);border:2px solid var(--border);cursor:pointer;transition:all .13s;background:#fff;display:flex;gap:12px;align-items:flex-start;}
    .pickup-card:hover{border-color:#B9C4EC;}
    .pc-ic{width:36px;height:36px;border-radius:10px;background:var(--ice);color:var(--cobalt);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .pc-ic svg{width:20px;height:20px;}
    .pc-name{font-weight:700;font-size:14px;line-height:1.3;}
    .pc-sub{font-size:12px;color:var(--muted);margin-top:2px;}
    .pickup-card.sel{border-color:var(--cobalt);background:var(--tint);}
    .pickup-card.sel .pc-ic{background:var(--cobalt);color:#fff;}
    .form-error{background:#FDECEC;color:#B4262B;border-radius:var(--r-xs);padding:11px 14px;font-size:14px;margin-bottom:14px;display:none;}
    .form-error.show{display:block;}
    .checkout-items{background:#fff;border-radius:var(--r);border:1.5px solid var(--border);padding:20px;position:sticky;top:calc(var(--nav-h) + 16px);}
    .checkout-items h3{font-size:16px;font-weight:800;margin-bottom:12px;}
    .co-item{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
    .co-item:last-of-type{border-bottom:none;}
    .co-info{flex:1;min-width:0;}
    .co-name{font-weight:600;font-size:14px;}
    .co-meta{font-size:12px;color:var(--muted);}
    .co-price{font-weight:700;font-size:14px;}

    /* CONFIRMATION */
    .confirm-page{padding:56px 0 80px;}
    .confirm-inner{max-width:560px;margin:0 auto;}
    .confirm-card{background:var(--ice);border-radius:24px;padding:32px;margin-bottom:16px;}
    .confirm-check{width:48px;height:48px;border-radius:14px;background:#fff;color:var(--ok);display:flex;align-items:center;justify-content:center;margin-bottom:28px;}
    .confirm-check svg{width:26px;height:26px;}
    .confirm-card .lbl-sm{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:2px;}
    .confirm-id{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(36px,7vw,52px);letter-spacing:-.03em;color:var(--ink);line-height:1.05;margin-bottom:8px;}
    .confirm-card .sub{font-size:15px;color:var(--muted);line-height:1.6;}
    .slip{background:#fff;border-radius:20px;border:1.5px solid var(--border);padding:22px 24px;margin-bottom:20px;}
    .slip-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:6px;border-bottom:1.5px dashed var(--border);}
    .ready{background:#E3F5EA;color:var(--ok);border-radius:var(--r-full);padding:4px 10px;font-size:12px;font-weight:700;}
    .cd-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;gap:12px;}
    .cd-row .lbl{color:var(--ink-2);}
    .cd-row .val{font-weight:700;text-align:right;}
    .cd-row.tot{border-top:1.5px dashed var(--border);margin-top:6px;padding-top:14px;}
    .cd-row.tot .lbl{font-weight:700;color:var(--ink);}
    .cd-row.tot .val{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:800;}
    .email-note{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);margin-top:14px;}
    .email-note svg{width:18px;height:18px;color:var(--cobalt);flex-shrink:0;}
    .confirm-actions{display:flex;gap:10px;flex-wrap:wrap;}
    .confirm-actions .btn{flex:1;min-width:180px;}

    /* LOGIN */
    .login-page{min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:40px 16px;background:var(--tint);}
    .login-card{background:#fff;border-radius:24px;padding:36px;width:100%;max-width:420px;border:1.5px solid var(--border);}
    .login-card .logo{margin-bottom:22px;}
    .login-card h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;}
    .login-card .lc-sub{font-size:14px;color:var(--muted);margin-bottom:20px;}
    .login-hint{background:var(--ice);border-radius:var(--r-xs);padding:12px 14px;margin-bottom:20px;font-size:13px;color:var(--ink-2);line-height:1.6;}
    .login-hint b{color:var(--ink);}

    /* ADMIN */
    .admin-page{padding:40px 0 80px;}
    .admin-tabs{display:inline-flex;gap:2px;background:var(--ice);border-radius:var(--r-full);padding:4px;margin-bottom:24px;}
    .atab{padding:8px 20px;border-radius:var(--r-full);font-weight:600;font-size:14px;border:none;background:transparent;color:var(--ink-2);transition:all .13s;}
    .atab.active{background:#fff;color:var(--cobalt);box-shadow:0 1px 4px rgba(14,21,48,.08);}
    .admin-panel{display:none;}
    .admin-panel.active{display:block;}
    .admin-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:12px;}
    .admin-top h2{font-size:20px;font-weight:800;}
    .admin-product-list{display:flex;flex-direction:column;gap:8px;}
    .ap-row{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r-sm);padding:10px 14px;border:1.5px solid var(--border);}
    .ap-info{flex:1;min-width:0;}
    .ap-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ap-meta{font-size:12px;color:var(--muted);margin-top:2px;}
    .ap-price{font-size:15px;flex-shrink:0;}
    .ap-del{background:none;border:none;color:var(--muted);padding:8px;border-radius:var(--r-xs);transition:all .13s;}
    .ap-del svg{width:18px;height:18px;}
    .ap-del:hover{color:var(--err);background:#FDECEC;}
    .order-list{display:flex;flex-direction:column;gap:8px;}
    .or-row{background:#fff;border-radius:var(--r-sm);border:1.5px solid var(--border);padding:16px 18px;}
    .or-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
    .or-id{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;color:var(--ink);}
    .or-time{font-size:12px;color:var(--muted);}
    .or-detail{font-size:13px;color:var(--ink-2);display:flex;gap:16px;flex-wrap:wrap;}
    .or-detail span b{color:var(--muted);font-weight:600;margin-right:4px;}
    .admin-empty{padding:56px;text-align:center;background:var(--tint);border-radius:var(--r);border:1.5px solid var(--border);color:var(--muted);font-size:14px;}

    /* PHOTOS */
    .pcard-thumb,.pd-thumb,.thumb-sm{position:relative;overflow:hidden;}
    .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .pcard-major{z-index:1;}

    /* SETUP */
    .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    @media(max-width:820px){.setup-grid{grid-template-columns:1fr;}}
    .setup-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:20px;}
    .setup-card h3{font-size:18px;font-weight:800;letter-spacing:-.02em;}
    .setup-card .hint{font-size:13px;color:var(--muted);margin:2px 0 14px;}
    .chip-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
    .chip{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-radius:var(--r-sm);background:var(--tint);border:1.5px solid var(--border);}
    .chip .cn{font-weight:600;font-size:14px;}
    .chip .cs{font-size:12px;color:var(--muted);}
    .chip .cx{margin-left:auto;}
    .chip .cnt{font-size:12px;color:var(--muted);white-space:nowrap;}
    .add-row{display:flex;gap:8px;flex-wrap:wrap;}
    .add-row input,.add-row select{flex:1 1 140px;min-width:0;height:44px;padding:0 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none;}
    .add-row input:focus,.add-row select:focus{border-color:var(--cobalt);}
    .add-row .btn{height:44px;padding:0 18px;}
    .uni-checks{display:flex;gap:8px;flex-wrap:wrap;}
    .ucheck{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-full);border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:600;cursor:pointer;user-select:none;}
    .field label.ucheck{display:flex;margin:0;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink-2);}
    .field .ucheck input{-webkit-appearance:checkbox;appearance:auto;accent-color:var(--cobalt);width:16px;height:16px;padding:0;margin:0;border:none;background:none;}
    .field .upload label.btn{display:inline-flex;margin:0;text-transform:none;letter-spacing:0;font-size:14px;font-weight:700;color:var(--cobalt);}
    .ucheck:has(input:checked){border-color:var(--cobalt);background:var(--tint);color:var(--cobalt);}
    .field .sub-hint{font-size:12px;color:var(--muted);margin-top:6px;}
    .upload{display:flex;gap:14px;align-items:center;padding:12px;border:1.5px dashed #B9C4EC;border-radius:var(--r-sm);background:var(--tint);}
    .upload-prev{width:84px;height:84px;border-radius:10px;background:var(--ice);flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
    .upload-prev .art{width:80%;}
    .upload-txt{flex:1;min-width:0;font-size:13px;color:var(--muted);}
    .upload-txt b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px;}
    .upload-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
    .or-line{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;}
    .or-line::before,.or-line::after{content:'';flex:1;height:1px;background:var(--border);}
    .ap-edit{background:none;border:none;color:var(--muted);padding:8px;border-radius:var(--r-xs);transition:all .13s;}
    .ap-edit svg{width:18px;height:18px;}
    .ap-edit:hover{color:var(--cobalt);background:var(--ice);}

    /* MODAL */
    .modal-bg{position:fixed;inset:0;background:rgba(14,21,48,.45);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
    .modal-box{background:#fff;border-radius:24px;padding:28px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;}
    .modal-box h2{font-size:22px;font-weight:800;margin-bottom:20px;}
    .art-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px;}
    .ap-pick{aspect-ratio:1;border-radius:var(--r-xs);border:2px solid var(--border);background:var(--ice);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;padding:4px;}
    .ap-pick .art{width:86%;}
    .ap-pick.sel{border-color:var(--cobalt);}
    .modal-footer{display:flex;gap:10px;margin-top:20px;}
    .modal-footer .btn{flex:1;}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

    /* TOAST */
    #toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:100%;max-width:380px;padding:0 16px;}
    .toast{background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-full);font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:tin .18s ease,tout .22s ease 2.4s forwards;white-space:nowrap;}
    .toast.err{background:var(--err);}
    @keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes tout{to{opacity:0;transform:translateY(-6px)}}

    /* FOOTER */
    footer{background:var(--ink);color:rgba(255,255,255,.55);padding:48px 0 32px;position:relative;overflow:hidden;}
    .footer-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:32px;}
    .footer-tag{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.03em;color:#fff;margin-top:16px;}
    .footer-links{display:flex;gap:20px;font-size:14px;}
    .footer-links a:hover{color:#fff;}
    .footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:18px;font-size:12px;}
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <div class="logo" onclick="R.go('home')" id="nav-logo"></div>
    <div class="nav-links">
      <button class="nav-link" onclick="setCatFilter('All',true)">Shop</button>
      <button class="nav-link" onclick="toast('Tell us what you need. Coming soon!')">Request an item</button>
    </div>
    <div class="nav-right">
      <button class="cart-btn" onclick="R.go('cart')" aria-label="Cart">
        <span id="cart-ic"></span>
        <span id="cart-nav-label">Cart</span>
        <span id="cart-nav-count" style="display:none" class="cart-count">0</span>
      </button>
      <button class="login-btn" id="login-nav-btn" onclick="handleLoginBtn()">Login</button>
    </div>
  </div>
</nav>

<div id="app"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script>
/* ───────── BRAND: logo ───────── */
function markSvg(o={}){
  const u=o.u||'#2D5BFF', r=o.r||'#0E1530', t=o.t||'#FFFFFF';
  return `<svg viewBox="16 8 92 104" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
  <path d="M26 28 V70 A20 20 0 0 0 66 70" fill="none" stroke="${u}" stroke-width="14" stroke-linecap="round"/>
  <path d="M66 18 V102" fill="none" stroke="${u}" stroke-width="14" stroke-linecap="round"/>
  <path d="M74 58 L96 32" stroke="#FF5FA2" stroke-width="12"/>
  <polygon points="100.6,35.9 91.4,28.1 103.1,23.6" fill="#FFE3B3"/>
  <polygon points="102.4,27.3 99.6,24.9 103.1,23.6" fill="#0E1530"/>
  <path d="M74 64 L98 100" stroke="${r}" stroke-width="12"/>
  <path d="M85 69.7 L80.8 72.4 M91 78.7 L86.8 81.4 M97 87.7 L92.8 90.4" stroke="${t}" stroke-width="2"/>
</svg>`;
}
function logoHtml(dark=false){
  const mk=dark?markSvg({u:'#5B7CFF',r:'#FFFFFF',t:'#0E1530'}):markSvg();
  return `<span class="mk">${mk}</span><span class="wm">Uni<b>Kit</b></span>`;
}
(function setFavicon(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2D5BFF"/><g transform="translate(9 7) scale(.48)">${markSvg({u:'#FFFFFF'}).replace(/<svg[^>]*>|<\/svg>/g,'')}</g></svg>`;
  document.getElementById('favicon').href='data:image/svg+xml,'+encodeURIComponent(svg);
})();

/* ───────── BRAND: line icons (24 grid, 1.75 stroke) ───────── */
const I=(d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="ico">${d}</svg>`;
const ICON={
  cart:I('<circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3.5h3l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.2a1.6 1.6 0 0 0 1.6-1.2l1.6-7.3H6.4"/>'),
  pin:I('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/>'),
  card:I('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/>'),
  pencil:I('<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/>'),
  check:I('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  arrow:I('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  back:I('<path d="M19 12H5M11 6l-6 6 6 6"/>'),
  chev:I('<path d="M6 9l6 6 6-6"/>'),
  plus:I('<path d="M12 5v14M5 12h14"/>'),
  mail:I('<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>'),
  trash:I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
  bag:I('<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'),
};

/* ───────── BRAND: product illustrations ───────── */
const K={co:'#2D5BFF',cd:'#1A3FCC',cl:'#5B7CFF',pk:'#FF5FA2',ink:'#0E1530',ink2:'#2A3352',wd:'#FFE3B3',w:'#FFFFFF',bd:'#DCE2F4',mt:'#A3ACC7'};
const shadow=(rx=58)=>`<ellipse cx="100" cy="182" rx="${rx}" ry="6" fill="${K.ink}" opacity=".07"/>`;
const range=(a,b,s)=>{const o=[];for(let x=a;x<=b;x+=s)o.push(x);return o;};
const ART={
  sketchbook:()=>`${shadow(54)}
    <rect x="58" y="46" width="94" height="128" rx="8" fill="${K.w}" stroke="${K.bd}" stroke-width="3"/>
    <rect x="48" y="38" width="96" height="132" rx="8" fill="${K.co}"/>
    <rect x="126" y="38" width="8" height="132" fill="${K.pk}"/>
    ${range(58,118,12).map(x=>`<rect x="${x}" y="28" width="6" height="22" rx="3" fill="${K.ink}"/>`).join('')}
    <rect x="62" y="110" width="54" height="38" rx="6" fill="${K.w}"/>
    <rect x="70" y="120" width="34" height="5" rx="2.5" fill="${K.ink}"/>
    <rect x="70" y="132" width="22" height="5" rx="2.5" fill="${K.bd}"/>`,
  pens:()=>{
    const pen=(cx,cap)=>`<rect x="${cx-9}" y="34" width="18" height="36" rx="7" fill="${cap}"/>
      <rect x="${cx-9}" y="66" width="18" height="76" rx="3" fill="${K.ink}"/>
      <rect x="${cx-9}" y="118" width="18" height="5" fill="${K.w}" opacity=".3"/>
      <polygon points="${cx-7},142 ${cx+7},142 ${cx+3},154 ${cx-3},154" fill="${K.mt}"/>
      <rect x="${cx-1.2}" y="154" width="2.4" height="10" fill="${K.ink}"/>`;
    return `${shadow(62)}<g transform="rotate(-8 100 110)">${pen(58,K.co)}${pen(86,K.pk)}${pen(114,K.wd)}${pen(142,K.cl)}</g>`;
  },
  scale:()=>`${shadow(64)}<g transform="rotate(-30 100 104)">
    <rect x="18" y="86" width="164" height="38" rx="6" fill="${K.co}"/>
    <rect x="18" y="86" width="164" height="24" rx="6" fill="${K.w}"/>
    <rect x="18" y="104" width="164" height="6" fill="${K.w}"/>
    <rect x="18" y="86" width="164" height="38" rx="6" fill="none" stroke="${K.ink}" stroke-width="3"/>
    ${range(28,172,8).map((x,i)=>`<rect x="${x}" y="86" width="2" height="${i%5===0?16:9}" fill="${K.ink}"/>`).join('')}
    <rect x="150" y="112" width="22" height="6" rx="3" fill="${K.w}" opacity=".6"/></g>`,
  graph:()=>`${shadow(56)}
    <rect x="46" y="36" width="108" height="138" rx="6" fill="${K.w}" stroke="${K.bd}" stroke-width="2"/>
    ${range(58,142,12).map(x=>`<line x1="${x}" y1="50" x2="${x}" y2="172" stroke="${K.co}" stroke-opacity=".22" stroke-width="1.5"/>`).join('')}
    ${range(62,166,12).map(y=>`<line x1="47" y1="${y}" x2="153" y2="${y}" stroke="${K.co}" stroke-opacity=".22" stroke-width="1.5"/>`).join('')}
    <rect x="46" y="28" width="108" height="20" rx="5" fill="${K.ink}"/>
    <polyline points="60,150 82,122 102,134 124,94 142,104" fill="none" stroke="${K.pk}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="124" cy="94" r="6" fill="${K.co}"/>`,
  calculator:()=>{
    let keys='';
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      const f=(r===3&&c===3)?K.pk:(c===3?K.co:K.ink2);
      keys+=`<rect x="${68+c*17}" y="${84+r*20}" width="13" height="14" rx="3.5" fill="${f}"/>`;
    }
    return `${shadow(46)}<g transform="rotate(6 100 100)">
      <rect x="56" y="26" width="88" height="150" rx="14" fill="${K.ink}"/>
      <rect x="66" y="38" width="68" height="34" rx="6" fill="${K.ice||'#EEF2FF'}"/>
      <text x="126" y="63" text-anchor="end" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="${K.co}">3.14</text>
      ${keys}</g>`;
  },
  charcoal:()=>`${shadow(58)}
    <line x1="68" y1="58" x2="80" y2="140" stroke="${K.ink}" stroke-width="13" stroke-linecap="round"/>
    <line x1="96" y1="40" x2="98" y2="140" stroke="${K.ink2}" stroke-width="13" stroke-linecap="round"/>
    <line x1="126" y1="52" x2="116" y2="140" stroke="${K.ink}" stroke-width="13" stroke-linecap="round"/>
    <line x1="148" y1="72" x2="134" y2="140" stroke="${K.ink2}" stroke-width="11" stroke-linecap="round"/>
    <rect x="46" y="112" width="108" height="58" rx="10" fill="${K.co}"/>
    <rect x="46" y="112" width="108" height="10" rx="5" fill="${K.cd}"/>
    <rect x="60" y="134" width="80" height="20" rx="10" fill="${K.w}"/>
    <text x="100" y="148" text-anchor="middle" font-family="DM Sans, sans-serif" font-weight="700" font-size="10" letter-spacing="1" fill="${K.ink}">CHARCOAL</text>`,
  paint:()=>{
    const tube=(col,rot)=>`<g transform="rotate(${rot} 100 160)">

        <div class="sum-row"><span class="lbl">Pickup</span><span class="val" style="color:var(--ok)">Free</span></div>
        <div class="sum-row total"><span class="lbl">Total</span><span class="val">EGP ${total}</span></div>
        <button class="btn btn-primary btn-full" style="margin-top:16px" onclick="R.go('checkout')">Checkout</button>
        <button class="btn btn-sec btn-full" style="margin-top:8px" onclick="setCatFilter('All',true)">Keep shopping</button>
      </div>
    </div>
  </div></div>`;
}
function chQty(id,qty){Cart.setQty(id,qty);updateNav();render();}

let _pickup=null;
function vCheckout(){
  const items=Cart.all();if(items.length===0){R.go('cart');return '';}
  const total=Cart.total();_pickup=null;
  const pickups=availablePickups();
  return `<div class="checkout-page"><div class="container">
    <a class="back-link" onclick="R.go('cart');return false;">${ICON.back} Back to cart</a>
    <h1 class="page-title">Checkout</h1>
    <p class="page-sub">No account needed. Just your details and a pickup spot.</p>
    <div class="checkout-grid">
      <div class="checkout-form-wrap">
        <h2>Your details</h2>
        <div class="form-error" id="co-err"></div>
        <div class="field"><label>Name (optional)</label><input id="co-name" type="text" placeholder="e.g. Faruk"></div>
        <div class="two">
          <div class="field"><label>Phone *</label><input id="co-phone" type="tel" placeholder="+20 1XX XXX XXXX"></div>
          <div class="field"><label>Email *</label><input id="co-email" type="email" placeholder="you@example.com"></div>
        </div>
        <div class="field"><label>Pickup location *</label>
          <div class="pickup-grid">${pickups.map(l=>`<div class="pickup-card" data-id="${l.id}" onclick="pickPickup('${l.id}')"><div class="pc-ic">${ICON.pin}</div><div><div class="pc-name">${esc(l.name)}</div><div class="pc-sub">${esc(Unis.all().find(u=>u.id===l.uni)?.full||uniName(l.uni))}</div></div></div>`).join('')||'<div class="form-error show">No pickup spots set up yet.</div>'}</div>
        </div>
        <button class="btn btn-primary btn-full" style="margin-top:6px" onclick="placeOrder()">Place order · EGP ${total}</button>
      </div>
      <div class="checkout-items">
        <h3>Your kit (${Cart.count()})</h3>
        ${items.map(i=>{const p=Products.get(i.id);return p?`<div class="co-item"><div class="thumb-sm thumb-xs">${pic(p)}</div><div class="co-info"><div class="co-name">${p.name}</div><div class="co-meta">×${i.qty}</div></div><div class="co-price">EGP ${p.price*i.qty}</div></div>`:''}).join('')}
        <div class="sum-row total"><span class="lbl">Total</span><span class="val">EGP ${total}</span></div>
      </div>
    </div>
  </div></div>`;
}
function availablePickups(){
  let ok=Unis.all().map(u=>u.id);
  Cart.all().forEach(i=>{const p=Products.get(i.id);if(p){const u=productUnis(p);ok=ok.filter(x=>u.includes(x));}});
  const list=Pickups.all().filter(l=>ok.includes(l.uni));
  return list.length?list:Pickups.all();
}
function pickPickup(id){_pickup=id;document.querySelectorAll('.pickup-card').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));}
function placeOrder(){
  const phone=document.getElementById('co-phone').value.trim();
  const email=document.getElementById('co-email').value.trim();
  const err=document.getElementById('co-err');
  if(!phone||!email||!_pickup){err.textContent='Add your phone, email and a pickup spot.';err.classList.add('show');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='That email looks off. Check it once more?';err.classList.add('show');return;}
  err.classList.remove('show');
  const orderId=genOrderId();
  const items=Cart.all().map(i=>{const p=Products.get(i.id);return p?{name:p.name,price:p.price,qty:i.qty,art:p.art}:null;}).filter(Boolean);
  const pickup=Pickups.all().find(l=>l.id===_pickup);
  const order={id:orderId,phone,email,name:document.getElementById('co-name').value.trim(),pickup:pickup.name,pickupId:_pickup,items,total:Cart.total(),createdAt:new Date().toISOString()};
  Orders.save(order);sendConfirmation(order);Cart.clear();updateNav();R.go('confirm/'+orderId);
}

function vConfirm(){
  const orderId=R.cur().p[0];const order=Orders.all().find(o=>o.id===orderId);if(!order){R.go('home');return '';}
  return `<div class="confirm-page"><div class="container"><div class="confirm-inner">
    <div class="confirm-card">
      <div class="confirm-check">${ICON.check}</div>
      <div class="lbl-sm">Order placed</div>
      <div class="confirm-id">${order.id}</div>
      <p class="sub">Show this number at ${order.pickup} and pay on pickup.</p>
      <div class="email-note">${ICON.mail}<span>We ${EMAIL_CFG.publicKey?'emailed':'would email'} your details to <b>${order.email}</b></span></div>
    </div>
    <div class="slip">
      <div class="slip-head"><div class="logo" style="cursor:default">${logoHtml()}</div><span class="ready">Confirmed</span></div>
      ${order.items.map(i=>`<div class="cd-row"><span class="lbl">${i.name} ×${i.qty}</span><span class="val">EGP ${i.price*i.qty}</span></div>`).join('')}
      <div class="cd-row"><span class="lbl">Pickup</span><span class="val">${order.pickup}</span></div>
      <div class="cd-row"><span class="lbl">Phone</span><span class="val">${order.phone}</span></div>
      <div class="cd-row tot"><span class="lbl">Total</span><span class="val">EGP ${order.total}</span></div>
    </div>
    <div class="confirm-actions">
      <button class="btn btn-primary" onclick="setCatFilter('All',true)">Keep shopping</button>
      <button class="btn btn-sec" onclick="R.go('home')">Back to home</button>
    </div>
  </div></div></div>`;
}

function vLogin(){
  return `<div class="login-page"><div class="login-card">
    <div class="logo" onclick="R.go('home')">${logoHtml()}</div>
    <h1>Admin sign in</h1>
    <div class="lc-sub">Manage products and see orders.</div>
    <div class="login-hint"><b>Demo:</b> admin@unikit.app / admin123</div>
    <div class="form-error" id="li-err">Wrong email or password. Try again?</div>
    <div class="field"><label>Email</label><input id="li-em" type="email" placeholder="admin@unikit.app" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="li-pw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Sign in</button>
    <button class="btn btn-sec btn-full" style="margin-top:8px" onclick="R.go('home')">Back to shop</button>
  </div></div>`;
}
function doLogin(){const ok=Auth.login(document.getElementById('li-em').value,document.getElementById('li-pw').value);if(!ok){document.getElementById('li-err').classList.add('show');return;}updateNav();R.go('admin');}

let _adminTab='products';
function vAdmin(){
  if(!Auth.isAdmin()){R.go('login');return '';}
  const products=Products.all();const orders=Orders.all();
  const tab=(id,label)=>`<button class="atab ${_adminTab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`;
  return `<div class="admin-page"><div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px">
      <div><h1 class="page-title">Dashboard</h1><p class="page-sub">${products.length} products · ${orders.length} orders</p></div>
      <button class="btn btn-sec btn-sm" onclick="doLogout()">Log out</button>
    </div>
    <div class="admin-tabs">${tab('products','Products')}${tab('orders','Orders'+(orders.length?' ('+orders.length+')':''))}${tab('setup','Setup')}</div>

    <div class="admin-panel ${_adminTab==='products'?'active':''}">
      <div class="admin-top"><h2>All products</h2><button class="btn btn-primary btn-sm" onclick="openProductModal()">${ICON.plus} Add product</button></div>
      ${products.length===0?`<div class="admin-empty">No products yet.</div>`:`<div class="admin-product-list">${products.map(p=>`<div class="ap-row"><div class="thumb-sm thumb-xs">${pic(p)}</div><div class="ap-info"><div class="ap-name">${esc(p.name)}</div><div class="ap-meta">${esc(p.major)} · ${esc(p.category)} · ${productUnis(p).map(uniName).map(esc).join(', ')}</div></div><div class="ap-price price">EGP ${p.price}</div><button class="ap-edit" title="Edit" onclick="openProductModal('${p.id}')">${ICON.pencil}</button><button class="ap-del" title="Delete" onclick="delProduct('${p.id}')">${ICON.trash}</button></div>`).join('')}</div>`}
    </div>

    <div class="admin-panel ${_adminTab==='orders'?'active':''}">
      <div class="admin-top"><h2>Orders</h2></div>
      ${orders.length===0?`<div class="admin-empty">No orders yet. They show up here as soon as a student checks out.</div>`:`<div class="order-list">${orders.map(o=>`<div class="or-row"><div class="or-head"><span class="or-id">${o.id}</span><span class="or-time">${new Date(o.createdAt).toLocaleString()}</span></div><div class="or-detail"><span><b>Email</b>${esc(o.email)}</span><span><b>Phone</b>${esc(o.phone)}</span><span><b>Pickup</b>${esc(o.pickup)}</span><span><b>Total</b><span class="price" style="color:var(--ink)">EGP ${o.total}</span></span></div><div style="margin-top:8px;font-size:13px;color:var(--muted)">${o.items.map(i=>`${esc(i.name)} ×${i.qty}`).join(' · ')}</div></div>`).join('')}</div>`}
    </div>

    <div class="admin-panel ${_adminTab==='setup'?'active':''}">${vSetup()}</div>
  </div></div>`;
}

function vSetup(){
  const unis=Unis.all(), pickups=Pickups.all(), majors=Majors.all(), cats=Cats.all(), prods=Products.all();
  const cnt=(n,w)=>`<span class="cnt">${n} ${w}${n===1?'':'s'}</span>`;
  const del=(fn,arg)=>`<button class="ap-del cx" title="Remove" onclick="${fn}('${esc(arg)}')">${ICON.trash}</button>`;
  return `<div class="setup-grid">
    <div class="setup-card">
      <h3>Universities</h3><p class="hint">Students filter the shop by these.</p>
      <div class="chip-list">${unis.map(u=>`<div class="chip"><div><div class="cn">${esc(u.name)}</div><div class="cs">${esc(u.full||'')}</div></div><span class="cx"></span>${cnt(pickups.filter(l=>l.uni===u.id).length,'pickup spot')}${del('removeUni',u.id)}</div>`).join('')||'<div class="cs">None yet.</div>'}</div>
      <div class="add-row"><input id="nu-short" placeholder="Short name, e.g. BUE"><input id="nu-full" placeholder="Full name (optional)"><button class="btn btn-primary" onclick="addUni()">Add</button></div>
    </div>

    <div class="setup-card">
      <h3>Pickup locations</h3><p class="hint">Shown at checkout. Each spot belongs to a university.</p>
      <div class="chip-list">${pickups.map(l=>`<div class="chip"><div class="pc-ic" style="width:30px;height:30px">${ICON.pin}</div><div><div class="cn">${esc(l.name)}</div><div class="cs">${esc(uniName(l.uni))}</div></div><span class="cx"></span>${del('removePickup',l.id)}</div>`).join('')||'<div class="cs">None yet.</div>'}</div>
      <div class="add-row"><input id="np-loc" placeholder="e.g. GUC Main Gate"><select id="np-loc-uni">${unis.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><button class="btn btn-primary" onclick="addPickup()" ${unis.length?'':'disabled'}>Add</button></div>
    </div>

    <div class="setup-card">
      <h3>Majors</h3><p class="hint">Shown on the home page and in the shop filter.</p>
      <div class="chip-list">${majors.map(m=>`<div class="chip"><div class="thumb-sm thumb-xs" style="width:34px;height:34px">${art(m.art)}</div><div class="cn">${esc(m.name)}</div><span class="cx"></span>${cnt(prods.filter(p=>p.major===m.name).length,'product')}${del('removeMajor',m.name)}</div>`).join('')||'<div class="cs">None yet.</div>'}</div>
      <div class="add-row"><input id="nm-name" placeholder="e.g. Medicine"><select id="nm-art">${ART_KEYS.map(k=>`<option value="${k}" ${k==='box'?'selected':''}>Picture: ${k}</option>`).join('')}</select><button class="btn btn-primary" onclick="addMajor()">Add</button></div>
    </div>

    <div class="setup-card">
      <h3>Categories</h3><p class="hint">The type of product, e.g. Drawing or Tools.</p>
      <div class="chip-list">${cats.map(c=>`<div class="chip"><div class="cn">${esc(c)}</div><span class="cx"></span>${cnt(prods.filter(p=>p.category===c).length,'product')}${del('removeCat',c)}</div>`).join('')||'<div class="cs">None yet.</div>'}</div>
      <div class="add-row"><input id="nc-name" placeholder="e.g. Lab equipment"><button class="btn btn-primary" onclick="addCat()">Add</button></div>
    </div>
  </div>`;
}
const val=id=>document.getElementById(id).value.trim();
function addUni(){const name=val('nu-short');if(!name)return toast('Add a short name','err');const a=Unis.all();let id=slug(name);if(a.some(u=>u.id===id||u.name.toLowerCase()===name.toLowerCase()))return toast('That university already exists','err');a.push({id,name,full:val('nu-full')});Unis.save(a);toast(name+' added');render();}
function removeUni(id){const used=Products.all().filter(p=>p.unis&&p.unis.length===1&&p.unis[0]===id).length;if(!confirm(`Remove ${uniName(id)}?${used?` ${used} product(s) are only sold there and will show for all universities.`:''} Its pickup spots are removed too.`))return;Unis.save(Unis.all().filter(u=>u.id!==id));Pickups.save(Pickups.all().filter(l=>l.uni!==id));toast('University removed');render();}
function addPickup(){const name=val('np-loc');if(!name)return toast('Add a location name','err');const a=Pickups.all();if(a.some(l=>l.name.toLowerCase()===name.toLowerCase()))return toast('That spot already exists','err');a.push({id:slug(name)+'-'+Date.now().toString(36),name,uni:document.getElementById('np-loc-uni').value});Pickups.save(a);toast(name+' added');render();}
function removePickup(id){Pickups.save(Pickups.all().filter(l=>l.id!==id));toast('Pickup spot removed');render();}
function addMajor(){const name=val('nm-name');if(!name)return toast('Add a major name','err');const a=Majors.all();if(a.some(m=>m.name.toLowerCase()===name.toLowerCase()))return toast('That major already exists','err');a.push({name,art:document.getElementById('nm-art').value});Majors.save(a);toast(name+' added');render();}
function removeMajor(name){const n=Products.all().filter(p=>p.major===name).length;if(n&&!confirm(`${n} product(s) use ${name}. Remove it anyway? They will keep the label but leave the major filter.`))return;Majors.save(Majors.all().filter(m=>m.name!==name));if(DB.get('catFilter')===name)DB.set('catFilter','All');toast('Major removed');render();}
function addCat(){const name=val('nc-name');if(!name)return toast('Add a category name','err');const a=Cats.all();if(a.some(c=>c.toLowerCase()===name.toLowerCase()))return toast('That category already exists','err');a.push(name);Cats.save(a);toast(name+' added');render();}
function removeCat(name){Cats.save(Cats.all().filter(c=>c!==name));toast('Category removed');render();}

function switchTab(t){_adminTab=t;render();}
function doLogout(){Auth.logout();updateNav();R.go('home');}
function delProduct(id){const p=Products.get(id);if(!p||!confirm(`Delete "${p.name}"?`))return;Products.del(id);toast('Product deleted');render();}

/* product add / edit */
let _pArt='box', _pImg=null, _editId=null;
function openProductModal(id){
  const p=id?Products.get(id):null;
  _editId=id||null; _pArt=p?.art||'box'; _pImg=p?.img||null;
  const majors=Majors.all().map(m=>m.name), cats=Cats.all(), unis=Unis.all();
  if(p&&p.major&&!majors.includes(p.major))majors.push(p.major);
  if(p&&p.category&&!cats.includes(p.category))cats.push(p.category);
  const pu=p?productUnis(p):unis.map(u=>u.id);
  document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal-box">
    <h2>${p?'Edit product':'Add product'}</h2>
    <div class="field"><label>Name *</label><input id="np-name" type="text" placeholder="e.g. A1 Sketchbook 80gsm" value="${esc(p?.name||'')}"></div>
    <div class="two">
      <div class="field"><label>Price (EGP) *</label><input id="np-price" type="number" placeholder="0" min="0" value="${p?.price??''}"></div>
      <div class="field"><label>Major *</label><select id="np-major"><option value="" disabled ${p?'':'selected'}>Select</option>${majors.map(m=>`<option ${p?.major===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Category *</label><select id="np-cat"><option value="" disabled ${p?'':'selected'}>Select</option>${cats.map(c=>`<option ${p?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="sub-hint">Add more majors and categories in Setup.</div></div>
    <div class="field"><label>Sold at *</label><div class="uni-checks">${unis.map(u=>`<label class="ucheck"><input type="checkbox" class="np-uni" value="${u.id}" ${pu.includes(u.id)?'checked':''}>${esc(u.name)}</label>`).join('')}</div></div>
    <div class="field"><label>Description</label><input id="np-desc" type="text" placeholder="Short description" value="${esc(p?.desc||'')}"></div>
    <div class="field"><label>Picture</label>
      <div class="upload">
        <div class="upload-prev" id="np-prev">${_pImg?`<img class="pic" src="${_pImg}" alt="">`:art(_pArt)}</div>
        <div class="upload-txt"><b>Upload a photo</b>JPG or PNG. We resize it for you.
          <div class="upload-btns"><label class="btn btn-quiet btn-sm" style="cursor:pointer">Choose photo<input type="file" accept="image/*" hidden onchange="onPhoto(this)"></label><button type="button" class="btn btn-sec btn-sm" id="np-rm" style="${_pImg?'':'display:none'}" onclick="removePhoto()">Remove photo</button></div>
        </div>
      </div>
      <div class="or-line">or pick an illustration</div>
      <div class="art-grid">${ART_KEYS.map(k=>`<button type="button" class="ap-pick ${!_pImg&&k===_pArt?'sel':''}" data-k="${k}" onclick="pickArt('${k}')">${art(k)}</button>`).join('')}</div>
    </div>
    <div class="modal-footer"><button class="btn btn-sec" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveProduct()">${p?'Save changes':'Save product'}</button></div>
  </div></div>`;
}
function refreshPrev(){
  document.getElementById('np-prev').innerHTML=_pImg?`<img class="pic" src="${_pImg}" alt="">`:art(_pArt);
  document.getElementById('np-rm').style.display=_pImg?'':'none';
  document.querySelectorAll('.ap-pick').forEach(b=>b.classList.toggle('sel',!_pImg&&b.dataset.k===_pArt));
}
function onPhoto(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!f.type.startsWith('image/'))return toast('Pick an image file','err');
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const max=700, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
    _pImg=c.toDataURL('image/jpeg',0.82);refreshPrev();
  };img.onerror=()=>toast('Could not read that image','err');img.src=r.result;};
  r.readAsDataURL(f);
}
function removePhoto(){_pImg=null;refreshPrev();}
function pickArt(k){_pArt=k;_pImg=null;refreshPrev();}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function saveProduct(){
  const name=val('np-name'), price=parseInt(document.getElementById('np-price').value), major=document.getElementById('np-major').value, cat=document.getElementById('np-cat').value, desc=val('np-desc');
  const unis=[...document.querySelectorAll('.np-uni:checked')].map(i=>i.value);
  if(!name||isNaN(price)||!major||!cat)return toast('Fill in all required fields','err');
  if(!unis.length)return toast('Pick at least one university','err');
  const data={name,price,major,category:cat,unis,art:_pArt,img:_pImg||null,desc:desc||'No description yet.'};
  const ok=_editId?Products.update(_editId,data):Products.add(data);
  if(!ok)return;
  closeModal();toast(_editId?'Product updated':'Product added');render();
}

function render(){
  const{r}=R.cur();
  const views={home:vHome,catalog:vCatalog,product:vProduct,cart:vCart,checkout:vCheckout,confirm:vConfirm,login:vLogin,admin:vAdmin};
  document.getElementById('app').innerHTML=(views[r]||vHome)();
  updateNav();
  if(r==='login')document.getElementById('li-pw')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
document.getElementById('nav-logo').innerHTML=logoHtml();
document.getElementById('cart-ic').innerHTML=ICON.cart;
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
